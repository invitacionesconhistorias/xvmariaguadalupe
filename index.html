<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Invitación no disponible</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Cinzel:wght@400&display=swap" rel="stylesheet">
<style>
:root{--rosa:#fbe3ea;--vino:#8a2049;--oro:#c4955a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;padding:1.5rem;background:radial-gradient(ellipse at 50% 0%,#fdf0f4,#f3c6d3);font-family:'Cormorant Garamond',Georgia,serif;color:#5b2a3b;text-align:center}
.box{max-width:360px;padding:2.6rem 1.6rem;border-radius:16px;background:rgba(255,250,248,.85);border:1px solid rgba(196,149,90,.6);box-shadow:0 0 0 6px rgba(255,246,244,.8),0 20px 40px rgba(120,30,60,.15)}
.k{font-family:'Cinzel',serif;letter-spacing:.28em;font-size:.72rem;color:var(--oro);margin-bottom:.8rem}
h1{font-weight:500;font-size:1.7rem;color:var(--vino);line-height:1.3}
.l{width:120px;height:1px;margin:1.1rem auto;background:linear-gradient(90deg,transparent,var(--oro),transparent)}
p{font-style:italic;font-size:1.15rem;line-height:1.55}
</style>
</head>
<body>
<div class="box">
  <p class="k">INVITACIÓN</p>
  <h1>Temporalmente no disponible</h1>
  <div class="l"></div>
  <p>Esta invitación no se encuentra disponible en este momento. Por favor, vuelve a intentarlo más tarde.</p>
</div>
</body>
</html>
